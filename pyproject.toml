[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qnet_autopilot"
version = "0.1.0"
description = "Physics and data layer for learned quantum-network control, built on SeQUeNCe"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["quantum network", "entanglement", "repeater", "QKD", "reinforcement learning"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
# SeQUeNCe is a hard dependency in practice but is kept optional here so the
# package installs in environments that reach it another way (a source
# checkout via SEQUENCE_SRC, or the vendored copy).
sequence = ["sequence>=1.0.0"]
report = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "matplotlib>=3.7"]

[project.scripts]
qnet-autopilot = "qnet_autopilot.cli:main"

[tool.setuptools.packages.find]
include = ["qnet_autopilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
